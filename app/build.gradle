apply plugin: 'com.android.application'
apply plugin: 'io.fabric'

android {
    compileSdkVersion 28
    //buildToolsVersion '28.0.2'

    defaultConfig {
        applicationId "eu.adamgiergun.wontgoshoppingpl"
        minSdkVersion 15
        targetSdkVersion 28
        versionCode 71
        versionName "2.0.999.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "en", "pl", "ru", "de", "uk", "cs", "sk", "be", "lt", "fr", "it", "es"
        //vectorDrawables.useSupportLibrary = true

        resValue "string", "ad_mob_app_id", WGS_AD_MOB_APP_ID
        resValue "string", "main_banner_ad_id", WGS_MAIN_BANNER_AD_ID
        resValue "string", "interstitial_ad_id", WGS_INTERSTITIAL_AD_ID
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "bool", "GOOGLE_ANALYTICS_ADID_ENABLED", "true"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_DEACTIVATED", "false"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_ENABLED", "true"
            resValue "bool", "FIREBASE_CRASHLYTICS_COLLECTION_ENABLED", "true"
        }
        debug {
            // Disable fabric build ID generation for debug builds
            ext.enableCrashlytics = false
            resValue "bool", "GOOGLE_ANALYTICS_ADID_ENABLED", "false"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_DEACTIVATED", "true"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_ENABLED", "false"
            resValue "bool", "FIREBASE_CRASHLYTICS_COLLECTION_ENABLED", "false"
        }

    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'eu.adamgiergun:mylibrary:0.99.91.4@aar'
    implementation 'eu.adamgiergun:myresources:1.0.4@aar'
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0-alpha5'
    implementation 'com.google.firebase:firebase-core:16.0.8'
    implementation 'com.google.firebase:firebase-ads:17.2.0'
    releaseImplementation 'com.crashlytics.sdk.android:crashlytics:2.9.9'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:2.21.0'
    androidTestImplementation 'androidx.test:runner:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
//    configurations {
//        all*.exclude group: 'com.google.firebase', module: 'firebase-core'
//        all*.exclude group: 'com.google.firebase', module: 'firebase-iid'
//    }
}

apply plugin: 'com.google.gms.google-services'
