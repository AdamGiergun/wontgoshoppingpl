apply plugin: 'com.android.application'
apply plugin: 'io.fabric'

android {
    compileSdkVersion 'android-R'
    // buildToolsVersion '28.0.2'

    defaultConfig {
        applicationId "eu.adamgiergun.wontgoshoppingpl"
        minSdkVersion 16
        targetSdkVersion 29
        versionCode 94
        versionName "2.3.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "en", "pl", "ru", "de", "uk", "cs", "sk", "be", "lt", "fr", "it", "es"
        //vectorDrawables.useSupportLibrary = true

        resValue "string", "ad_mob_app_id", WGS_AD_MOB_APP_ID
        resValue "string", "main_banner_ad_id", WGS_MAIN_BANNER_AD_ID
        resValue "string", "interstitial_ad_id", WGS_INTERSTITIAL_AD_ID
    }

    signingConfigs {
        release {
            keyAlias wgs_alias
            keyPassword wgs_password
            storeFile file(wgs_keystore)
            storePassword wgs_password
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            resValue "bool", "GOOGLE_ANALYTICS_ADID_ENABLED", "true"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_DEACTIVATED", "false"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_ENABLED", "true"
            resValue "bool", "FIREBASE_CRASHLYTICS_COLLECTION_ENABLED", "true"
        }
        debug {
            // Disable fabric build ID generation for debug builds
            ext.enableCrashlytics = false
            resValue "bool", "GOOGLE_ANALYTICS_ADID_ENABLED", "false"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_DEACTIVATED", "true"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_ENABLED", "false"
            resValue "bool", "FIREBASE_CRASHLYTICS_COLLECTION_ENABLED", "false"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'eu.adamgiergun:mylibrary:0.99.98.5@aar'
    implementation 'eu.adamgiergun:myresources:1.0.9@aar'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0-beta4'
    implementation 'com.google.firebase:firebase-core:17.2.3'
    implementation 'com.google.firebase:firebase-ads:19.0.1'
    releaseImplementation 'com.crashlytics.sdk.android:crashlytics:2.10.1'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:2.21.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
//    configurations {
//        all*.exclude group: 'com.google.firebase', module: 'firebase-core'
//        all*.exclude group: 'com.google.firebase', module: 'firebase-iid'
//    }
}

apply plugin: 'com.google.gms.google-services'
