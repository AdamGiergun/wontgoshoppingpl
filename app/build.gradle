apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: "androidx.navigation.safeargs.kotlin"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    compileSdkVersion 30

    buildFeatures {
        dataBinding true
    }

    defaultConfig {
        applicationId "eu.adamgiergun.wontgoshoppingpl"
        minSdkVersion 16
        targetSdkVersion 30
        versionCode 104
        versionName "2.99.7.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "en", "pl", "ru", "de", "uk", "cs", "sk", "be", "lt", "fr", "it", "es"
        //vectorDrawables.useSupportLibrary = true

        resValue "string", "ad_mob_app_id", WGS_AD_MOB_APP_ID
        resValue "string", "main_banner_ad_id", WGS_MAIN_BANNER_AD_ID
        resValue "string", "interstitial_ad_id", WGS_INTERSTITIAL_AD_ID

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation":
                                      "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            keyAlias wgs_alias
            keyPassword wgs_password
            storeFile file(wgs_keystore)
            storePassword wgs_password
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            resValue "bool", "GOOGLE_ANALYTICS_ADID_ENABLED", "true"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_DEACTIVATED", "false"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_ENABLED", "true"
            resValue "bool", "FIREBASE_CRASHLYTICS_COLLECTION_ENABLED", "true"
        }
        debug {
            // Disable fabric build ID generation for debug builds
            ext.enableCrashlytics = false
            resValue "bool", "GOOGLE_ANALYTICS_ADID_ENABLED", "false"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_DEACTIVATED", "true"
            resValue "bool", "FIREBASE_ANALYTICS_COLLECTION_ENABLED", "false"
            resValue "bool", "FIREBASE_CRASHLYTICS_COLLECTION_ENABLED", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'eu.adamgiergun:mylibrary:0.99.98.10@aar'
    implementation 'eu.adamgiergun:mykotlinlibrary:0.1.15@aar'
    implementation 'eu.adamgiergun:myresources:1.0.12@aar'

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation "androidx.fragment:fragment-ktx:1.2.5"
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'

    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.1.1'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "androidx.core:core-ktx:1.3.1"

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.2.0"

    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    //implementation 'com.google.firebase:firebase-ads:19.4.0'
    implementation 'com.google.android.gms:play-services-ads:19.4.0'
    implementation 'com.google.firebase:firebase-analytics:17.5.0'
    implementation 'com.google.firebase:firebase-crashlytics:17.2.1'

    annotationProcessor "androidx.room:room-compiler:$room_version"


    testImplementation 'junit:junit:4.13'
    testImplementation 'org.mockito:mockito-core:2.21.0'

    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

//    configurations {
//        all*.exclude group: 'com.google.firebase', module: 'firebase-core'
//        all*.exclude group: 'com.google.firebase', module: 'firebase-iid'
//    }

    configurations.all() {
        resolutionStrategy.force "org.antlr:antlr4-runtime:4.7.1"
        resolutionStrategy.force "org.antlr:antlr4-tool:4.7.1"
    }
}
